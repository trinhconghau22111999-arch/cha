# App "tivi" cài trên TV. Mã nguồn: android_tivi/
name: Android Tivi TV APK

on:
  push:
    paths:
      - "android_tivi/**"
      - ".github/workflows/android-tivi-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: android_tivi
        run: gradle :tv:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tivi-tv-apk
          path: android_tivi/tv/build/outputs/apk/debug/tv-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tivi-build-${{ github.run_number }}
          name: "Tivi TV - Build #${{ github.run_number }}"
          body: "tv-debug.apk = app tivi cài trên TV (nhận tệp từ điện thoại, nút Tệp để cài APK)"
          files: android_tivi/tv/build/outputs/apk/debug/tv-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
