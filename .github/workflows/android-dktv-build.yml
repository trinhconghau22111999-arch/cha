# App điều khiển TV/PC TỔNG HỢP (gộp DK_TV + dktv của a3). Mã nguồn: android_dktv/
name: Android DK TV Gop APK

on:
  push:
    paths:
      - "android_dktv/**"
      - ".github/workflows/android-dktv-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Firebase (ghép nối WebRTC): secret GOOGLE_SERVICES_JSON_BASE64 phải có trong repo này
      - name: Tạo google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" | base64 --decode > android_dktv/dktv/google-services.json
            python3 - <<'PY'
          import json
          p = "android_dktv/dktv/google-services.json"
          d = json.load(open(p))
          for c in d.get("client", []):
              c["client_info"]["android_client_info"]["package_name"] = "com.hau.dktvall"
          json.dump(d, open(p, "w"), indent=2)
          PY
          else
            echo "::warning::Thiếu secret GOOGLE_SERVICES_JSON_BASE64 - app sẽ không kết nối được Firebase"
          fi

      - name: Build debug APK
        working-directory: android_dktv
        run: gradle :dktv:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dktv-gop-apk
          path: android_dktv/dktv/build/outputs/apk/debug/dktv-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dktv-build-${{ github.run_number }}
          name: "DK TV Gộp - Build #${{ github.run_number }}"
          body: "dktv-debug.apk = app điều khiển từ xa tổng hợp (DK TV + DK TV 2)"
          files: android_dktv/dktv/build/outputs/apk/debug/dktv-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
