# Mỗi lần chạy: build 2 app Android rồi tạo MỘT release (tag build-<số lần chạy>) chứa 2 file APK.
# Tên file APK cố định (DK-TV-Gop.apk, Tivi-TV.apk) nên link .../releases/latest/download/<tên file> luôn trỏ tới bản mới nhất.
name: Build all apps

on:
  push:
    paths:
      - "android_dktv/**"
      - "android_tivi/**"
      - ".github/workflows/build-all.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dktv:
    name: Build DK TV Gộp (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Firebase (ghép nối WebRTC): secret GOOGLE_SERVICES_JSON_BASE64 phải có trong repo này
      - name: Tạo google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" | base64 --decode > android_dktv/dktv/google-services.json
            python3 - <<'PY'
          import json
          p = "android_dktv/dktv/google-services.json"
          d = json.load(open(p))
          for c in d.get("client", []):
              c["client_info"]["android_client_info"]["package_name"] = "com.hau.dktvall"
          json.dump(d, open(p, "w"), indent=2)
          PY
          else
            echo "::warning::Thiếu secret GOOGLE_SERVICES_JSON_BASE64 - app sẽ không kết nối được Firebase"
          fi

      - name: Build debug APK
        working-directory: android_dktv
        run: gradle :dktv:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dktv-gop-apk
          path: android_dktv/dktv/build/outputs/apk/debug/dktv-debug.apk
          if-no-files-found: error

  build-tivi:
    name: Build Tivi TV (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: android_tivi
        run: gradle :tv:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tivi-tv-apk
          path: android_tivi/tv/build/outputs/apk/debug/tv-debug.apk
          if-no-files-found: error

  release:
    name: Tạo release gộp 2 app
    needs: [build-dktv, build-tivi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dktv-gop-apk
          path: release-in/dktv

      - uses: actions/download-artifact@v4
        with:
          name: tivi-tv-apk
          path: release-in/tivi

      - name: Đặt tên file phát hành (tên cố định, không có số build)
        run: |
          mkdir -p release
          cp release-in/dktv/dktv-debug.apk "release/DK-TV-Gop.apk"
          cp release-in/tivi/tv-debug.apk "release/Tivi-TV.apk"
          ls -la release

      - name: Create Release (1 trang, 2 file APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          make_latest: true
          body: |
            Build #${{ github.run_number }} gồm 2 app Android:

            - DK-TV-Gop.apk: app điều khiển từ xa tổng hợp (DK TV + DK TV 2), cài trên điện thoại Android.
            - Tivi-TV.apk: app tivi cài trên TV (nhận tệp từ điện thoại, nút Tệp để cài APK).

            Link tải cố định (luôn là bản mới nhất):
            - https://github.com/${{ github.repository }}/releases/latest/download/DK-TV-Gop.apk
            - https://github.com/${{ github.repository }}/releases/latest/download/Tivi-TV.apk
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
