# Mỗi lần chạy: build 3 app Android rồi tạo MỘT release (tag build-<số lần chạy>) chứa 3 file APK.
# Tên file APK cố định (DK-TV-Gop.apk, Tivi-TV.apk, ScreenCast.apk) nên link .../releases/latest/download/<tên file> luôn trỏ tới bản mới nhất.
name: Build all apps

on:
  push:
    paths:
      - "android_dktv/**"
      - "android_tivi/**"
      - "android_screencast/**"
      - ".github/workflows/build-all.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dktv:
    name: Build DK TV Gộp (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Firebase (ghép nối WebRTC): secret GOOGLE_SERVICES_JSON_BASE64 phải có trong repo này
      - name: Tạo google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" | base64 --decode > android_dktv/dktv/google-services.json
            python3 - <<'PY'
          import json
          p = "android_dktv/dktv/google-services.json"
          d = json.load(open(p))
          for c in d.get("client", []):
              c["client_info"]["android_client_info"]["package_name"] = "com.hau.dktvall"
          json.dump(d, open(p, "w"), indent=2)
          PY
          else
            echo "::warning::Thiếu secret GOOGLE_SERVICES_JSON_BASE64 - app sẽ không kết nối được Firebase"
          fi

      - name: Build debug APK
        working-directory: android_dktv
        run: gradle :dktv:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dktv-gop-apk
          path: android_dktv/dktv/build/outputs/apk/debug/dktv-debug.apk
          if-no-files-found: error

  build-tivi:
    name: Build Tivi TV (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: android_tivi
        run: |
          set -o pipefail
          gradle :tv:assembleDebug --no-daemon 2>&1 | tee /tmp/build.log || {
            grep -E "^e: |^w: .*error|error:|What went wrong|Manifest merger|Could not|> Could|FAILURE|Caused by" /tmp/build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            grep -A4 "What went wrong" /tmp/build.log | head -20 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: tivi-tv-apk
          path: android_tivi/tv/build/outputs/apk/debug/tv-debug.apk
          if-no-files-found: error

  build-screencast:
    name: Build ScreenCast (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: android_screencast
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-apk
          path: android_screencast/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Tạo release gộp 3 app
    needs: [build-dktv, build-tivi, build-screencast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dktv-gop-apk
          path: release-in/dktv

      - uses: actions/download-artifact@v4
        with:
          name: tivi-tv-apk
          path: release-in/tivi

      - uses: actions/download-artifact@v4
        with:
          name: ScreenCast-apk
          path: release-in/screencast

      - name: Đặt tên file phát hành (tên cố định, không có số build)
        run: |
          mkdir -p release
          cp release-in/dktv/dktv-debug.apk "release/DK-TV-Gop.apk"
          cp release-in/tivi/tv-debug.apk "release/Tivi-TV.apk"
          cp release-in/screencast/app-debug.apk "release/ScreenCast.apk"
          ls -la release

      - name: Create Release (1 trang, 3 file APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          TAG="build-${{ github.run_number }}"
          cat > notes.md <<'NOTES'
          Build #${{ github.run_number }} gồm 3 app Android:

          - DK-TV-Gop.apk: app điều khiển từ xa tổng hợp (DK TV + DK TV 2), cài trên điện thoại Android.
          - Tivi-TV.apk: app tivi cài trên TV (nhận tệp từ điện thoại, nút Tệp để cài APK).
          - ScreenCast.apk: app "Ái-kara" (Tube for me) cài trên điện thoại, chiếu hình lên TV qua WiFi (WebRTC).

          Link tải cố định (luôn là bản mới nhất):
          - https://github.com/${{ github.repository }}/releases/latest/download/DK-TV-Gop.apk
          - https://github.com/${{ github.repository }}/releases/latest/download/Tivi-TV.apk
          - https://github.com/${{ github.repository }}/releases/latest/download/ScreenCast.apk
          NOTES
          cd release
          # GitHub đôi khi trả lỗi tạm thời (release vừa tạo chưa tìm thấy theo tag, trả về trang 404):
          # thử lại tối đa 5 lần. Đã có release thì tải tệp lên đè, chưa có thì tạo mới cùng lúc với tệp.
          ok=0
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" ./*.apk --clobber; then ok=1; break; fi
            else
              if gh release create "$TAG" ./*.apk --title "Build #${{ github.run_number }}" --notes-file ../notes.md --latest; then ok=1; break; fi
            fi
            echo "Chưa xong (lần $i), thử lại sau 20 giây..."
            sleep 20
          done
          if [ "$ok" != 1 ]; then echo "::error::Không tạo/cập nhật được release $TAG"; exit 1; fi
