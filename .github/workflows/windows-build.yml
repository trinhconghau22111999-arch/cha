# Đặt tại: .github/workflows/windows-build.yml trong repo MỚI (không dùng repo a3)
# Cấu trúc repo: windows_tivi/ (TiviWidget, TiviWidget.Tests, installer, global.json)
name: Windows widget

on:
  push:
    paths:
      - "windows_tivi/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: windows_tivi
        run: dotnet restore TiviWidget/TiviWidget.csproj

      - name: Test (kiểm thử tự động)
        working-directory: windows_tivi
        run: dotnet test TiviWidget.Tests/TiviWidget.Tests.csproj --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: windows_tivi/TiviWidget.Tests/TestResults/results.trx

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Publish + build installer
        working-directory: windows_tivi
        shell: pwsh
        run: ./installer/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TiviWidget-Setup
          path: windows_tivi/installer/Output/*.exe
