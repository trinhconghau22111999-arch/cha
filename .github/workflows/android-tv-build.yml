# Đặt tại: .github/workflows/android-tv-build.yml trong repo MỚI
# Cấu trúc repo: android_tivi/ (copy nguyên module tv + gradle gốc + keystore)
name: Android TV APK

on:
  push:
    paths:
      - "android_tivi/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build tv debug APK
        working-directory: android_tivi
        run: gradle :tv:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tv-debug-apk
          path: android_tivi/tv/build/outputs/apk/debug/tv-debug.apk
