<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghi chú</title>
<style>
html,body{margin:0;height:100%;background:#05070d;font-family:sans-serif}
body{background:linear-gradient(#fff 0,#fff 40px,#05070d 40px)}
body{display:flex;flex-direction:column;position:relative;box-sizing:border-box;height:100%;padding-top:40px}
#list{display:none;position:absolute;left:0;top:40px;right:0;bottom:0;background:#fff;z-index:5;flex-direction:column}
#list.on{display:flex}
#lh{background:#fff;padding:8px;display:flex;gap:8px;align-items:center;border-bottom:2px solid #00e5ff55}
#lh span{color:#222;font-size:16px;font-weight:bold}
#lh{position:relative;box-sizing:border-box;min-height:64px}
#bLsNew{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#lb{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
#lb button{text-align:left;background:#10162a;border:1px solid #00e5ff66;font-weight:normal;font-size:17px}
#lb .e{color:#555;font-size:16px;padding:20px}
.row{display:flex;gap:8px;align-items:stretch}
#lb .nm{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .row button.c,#lb .row button.d{flex:0 0 auto;white-space:nowrap}
#lb button.c{background:#8e44ad;border-color:transparent}
#lb button.d{background:#c62828;border-color:transparent}
#top button{white-space:nowrap;flex:0 0 auto}
#bSave{margin-left:auto}
#top,#imgbar{background:#fff;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:2px solid #00e5ff55}
#imgbar{display:none;background:#fff}
#imgbar span{color:#222;font-size:15px;font-weight:bold}
button{font-size:16px;font-weight:bold;border:0;border-radius:8px;padding:10px 14px;color:#fff;background:#263248}
button.n{background:#1e88e5}button.s{background:#00b85c}button.c{background:#8e44ad}button.i{background:#ef6c00}button.d{background:#c62828}
#title{flex:1 1 150px;min-width:120px;font-size:16px;padding:9px 10px;border-radius:8px;border:1px solid #00e5ff99;background:#fff;color:#111}
#wrap{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;min-height:0}
#ed{flex:1 0 auto;box-sizing:border-box;margin-bottom:0;background:#fff;color:#111;border-radius:10px;padding:14px;font-size:19px;line-height:1.45;outline:none;word-wrap:break-word}
#ed:empty:before{content:attr(data-ph);color:#999}
#ed:after{content:"";display:block;clear:both}
#ed img{max-width:100%;cursor:pointer}
#ed img.l{float:left;margin:2px 14px 6px 0}
#ed img.r{float:right;margin:2px 0 6px 14px}
#ed img.b{display:block;float:none;margin:8px auto}
#ed img.sel{outline:3px solid #00e5ff}
</style></head><body>
<div id="top">
  <button class="i" id="bList">📂 Danh sách</button>
  <button class="c" id="bCopy">📋 Copy ghi chú</button>
  <button class="i" id="bPaste">🖼 Dán ảnh</button>
  <input id="title" placeholder="Tiêu đề">
  <button class="s" id="bSave">💾 Lưu</button>
</div>
<div id="imgbar">
  <span>Ảnh:</span>
  <button id="pL">◀ Trái</button><button id="pB">▣ Giữa</button><button id="pR">Phải ▶</button>
  <button id="zM">− Nhỏ</button><button id="zP">+ Lớn</button>
  <button class="c" id="cI">📋 Copy ảnh</button>
  <button class="d" id="dI">🗑 Xoá ảnh</button>
  <button id="xI">✔ Xong</button>
</div>
<div id="list"><div id="lh"><span>Ghi chú đã lưu</span><button class="n" id="bLsNew">➕ Ghi chú mới</button></div><div id="lb"></div></div>
<div id="wrap"><div id="ed" contenteditable="true" data-ph="Gõ ghi chú ở đây... Dán ảnh: ảnh nằm trái/phải thì chữ chạy bên cạnh ảnh"></div></div>
<script>
var ed=document.getElementById('ed'),ti=document.getElementById('title'),bar=document.getElementById('imgbar');
var sel=null,saved=null,tmr=null;
function A(){return window.AndroidNote}
function $(id){return document.getElementById(id)}

document.addEventListener('selectionchange',function(){
  var s=getSelection();
  if(s.rangeCount&&ed.contains(s.anchorNode))saved=s.getRangeAt(0).cloneRange();
});

function cleanHtml(){
  var c=ed.cloneNode(true);
  c.querySelectorAll('img.sel').forEach(function(i){i.classList.remove('sel')});
  return c.innerHTML;
}
function schedule(){clearTimeout(tmr);tmr=setTimeout(function(){flush(false)},1500)}
function flush(manual){
  clearTimeout(tmr);
  if(!A())return;
  A().save(ti.value,cleanHtml(),ed.innerText||'',ed.querySelector('img')?1:0,manual?1:0);
}

function unselect(){if(sel)sel.classList.remove('sel');sel=null;bar.style.display='none'}
function select(img){
  if(sel)sel.classList.remove('sel');
  sel=img;img.classList.add('sel');bar.style.display='flex';
}

/* thu nhỏ ảnh quá lớn trước khi chèn */
function shrink(src,cb){
  var im=new Image();
  im.onload=function(){
    var M=1280,w=im.naturalWidth,h=im.naturalHeight;
    if(w<=M&&h<=M&&src.length<900000){cb(src);return}
    var k=Math.min(1,M/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.round(w*k);c.height=Math.round(h*k);
    var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
    var png=/^data:image\/png/.test(src);
    cb(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.85));
  };
  im.onerror=function(){cb(src)};
  im.src=src;
}
function insertImg(src){
  shrink(src,function(s){
    ed.focus();
    var g=getSelection();
    if(saved){g.removeAllRanges();g.addRange(saved)}
    document.execCommand('insertHTML',false,'<img class="l" style="width:30%" src="'+s+'">');
    schedule();
  });
}

ed.addEventListener('input',schedule);
ti.addEventListener('input',schedule);
ed.addEventListener('paste',function(e){
  var cd=e.clipboardData;if(!cd)return;
  var files=[];
  for(var i=0;i<cd.items.length;i++){var it=cd.items[i];if(it.kind==='file'&&it.type.indexOf('image/')===0)files.push(it.getAsFile())}
  e.preventDefault();
  if(files.length){
    files.forEach(function(f){var r=new FileReader();r.onload=function(){insertImg(r.result)};r.readAsDataURL(f)});
    return;
  }
  var t=cd.getData('text/plain');
  if(t)document.execCommand('insertText',false,t);
  else if(A())A().pasteImage();
  schedule();
});
ed.addEventListener('click',function(e){
  if(e.target&&e.target.tagName==='IMG')select(e.target);else unselect();
});

function setPos(p){if(!sel)return;sel.className=p+' sel';schedule()}
function size(d){
  if(!sel)return;
  var w=parseFloat(sel.style.width)||30;
  sel.style.width=Math.max(8,Math.min(100,w+d))+'%';schedule();
}
$('pL').onclick=function(){setPos('l')};
$('pR').onclick=function(){setPos('r')};
$('pB').onclick=function(){setPos('b')};
$('zM').onclick=function(){size(-8)};
$('zP').onclick=function(){size(8)};
$('xI').onclick=unselect;
$('dI').onclick=function(){if(sel){sel.remove();unselect();schedule()}};
$('cI').onclick=function(){if(sel&&A())A().copyImage(sel.src)};

function newNote(){
  flush(false);
  if(!A())return;
  ti.value=A().newTitle();
  ed.innerHTML='';unselect();saved=null;
};
/* Con trỏ (chuột remote) vẫn đặt con trỏ / chọn chữ bình thường trong ô.
   Đã bỏ nút bật/tắt bàn phím riêng của Ghi chú (dùng bàn phím ảo nổi ⌨ trên thanh dưới); bàn phím hệ thống luôn ẩn. */
var kbOn=false;
function kbUI(){
  var m=kbOn?'text':'none';
  ed.setAttribute('inputmode',m);ti.setAttribute('inputmode',m);
}
function leftEditing(){
  setTimeout(function(){
    if(document.activeElement!==ed&&document.activeElement!==ti){kbOn=false;kbUI()}
  },0);
}
function onEditFocus(){ if(!kbOn&&A()) try{A().hideIme()}catch(e){} }
ed.addEventListener('focus',onEditFocus);
ti.addEventListener('focus',onEditFocus);
ed.addEventListener('blur',leftEditing);
ti.addEventListener('blur',leftEditing);
kbUI();
$('bSave').onclick=function(){flush(true);showList()};   /* lưu ngay (ghi tệp đồng bộ) rồi về trang danh sách */
$('bCopy').onclick=function(){if(A())A().copy(ed.innerText||'',cleanHtml())};
$('bPaste').onclick=function(){if(A())A().pasteImage()};

/* gọi từ ứng dụng */
function loadNote(title,html){hideList();ti.value=title;ed.innerHTML=html;unselect();saved=null}
function showList(){
  if(!A())return;
  flush(false);
  var arr=[];try{arr=JSON.parse(A().list())}catch(e){}
  var b=$('lb');b.innerHTML='';
  if(!arr.length){var p=document.createElement('div');p.className='e';p.textContent='Chưa có ghi chú nào.';b.appendChild(p)}
  arr.forEach(function(n){
    var row=document.createElement('div');row.className='row';
    var x=document.createElement('button');x.className='nm';
    x.textContent='📝 '+n.name+'   ('+n.time+')';
    x.onclick=function(){hideList();if(A())A().open(n.name)};
    var c=document.createElement('button');c.className='c';c.textContent='📋 Copy';
    c.onclick=function(){
      if(!A())return;
      A().copyNote(n.name);
      c.textContent='✔ Đã copy';
      setTimeout(function(){c.textContent='📋 Copy'},1500);
    };
    var d=document.createElement('button');d.className='d';d.textContent='🗑 Xoá';
    d.onclick=function(){doDelete(n.name)};
    row.appendChild(x);row.appendChild(c);row.appendChild(d);
    b.appendChild(row);
  });
  $('list').classList.add('on');
  try{A().listState(true)}catch(e){}
}
function hideList(){$('list').classList.remove('on');try{A().listState(false)}catch(e){}}

/* Xoá một ghi chú trong danh sách */
function doDelete(name){
  if(!A()||!name)return;
  try{
    clearTimeout(tmr);
    var wasOpen=A().delete(name);
    if(wasOpen){ /* đang soạn đúng ghi chú vừa xoá: làm trống trang, không lưu lại */
      ed.innerHTML='';ti.value='';unselect();saved=null;
      ti.value=A().newTitle();
    }
  }catch(e){ try{A().toast('Lỗi xoá: '+e)}catch(_){} }
  showList();
}
$('bList').onclick=showList;
$('bLsNew').onclick=function(){hideList();newNote()};
window.onload=function(){if(A())A().ready()};
</script>
</body></html>
