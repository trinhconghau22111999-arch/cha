<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghi chú</title>
<style>
html,body{margin:0;height:100%;background:#05070d;font-family:sans-serif}
body{display:flex;flex-direction:column;position:relative;box-sizing:border-box;height:100%;padding-top:0}
#list{display:none;position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;z-index:5;flex-direction:column}
#list.on{display:flex}
#lh{background:#fff;padding:8px;display:flex;gap:8px;align-items:center;border-bottom:2px solid #00e5ff55}
#lh span{color:#222;font-size:16px;font-weight:bold}
#lh{position:relative;box-sizing:border-box;min-height:64px}
#bLsNew{margin-left:auto;margin-right:4px}
#lb{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
#lb button{text-align:left;background:#10162a;border:1px solid #00e5ff66;font-weight:normal;font-size:17px}
#lb .e{color:#555;font-size:16px;padding:20px}
.row{display:flex;gap:8px;align-items:stretch}
#lb .nm{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .row button.c,#lb .row button.d{flex:0 0 auto;white-space:nowrap}
#lb button.c{background:#8e44ad;border-color:transparent}
#lb button.d{background:#c62828;border-color:transparent}
#top button{white-space:nowrap;flex:0 0 auto}
#bSave{margin-left:auto}
#top,#imgbar{background:#fff;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:2px solid #00e5ff55}
#imgbar{display:none;background:#fff}
#imgbar span{color:#222;font-size:15px;font-weight:bold}
button{font-size:16px;font-weight:bold;border:0;border-radius:8px;padding:10px 14px;color:#fff;background:#263248}
button.n{background:#1e88e5}button.s{background:#00b85c}button.c{background:#8e44ad}button.i{background:#ef6c00}button.d{background:#c62828}
#bList{background:#c62828}
#bPaste{background:#e91e63}
#title{flex:1 1 150px;min-width:120px;font-size:16px;padding:9px 10px;border-radius:8px;border:1px solid #00e5ff66;background:#10162a;color:#fff}
#wrap{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;min-height:0}
#ed{flex:1 0 auto;box-sizing:border-box;margin-bottom:0;background:#fff;color:#111;border-radius:10px;padding:14px;font-size:19px;line-height:1.45;outline:none;word-wrap:break-word}
/* gạch chân liền nét, nằm dưới cả đuôi chữ g y p q */
#ed{text-decoration-skip-ink:none;-webkit-text-decoration-skip:none;text-underline-position:under}
/* vùng quét khối chỉ tô nền mờ, không đổi màu chữ (đổi màu là thấy ngay) */
#ed::selection,#ed *::selection{background:rgba(30,136,229,.28)}
#ed:empty:before{content:attr(data-ph);color:#999}
#ed:after{content:"";display:block;clear:both}
#ed img{max-width:100%;cursor:pointer}
#ed img.l{float:left;margin:2px 14px 6px 0}
#ed img.r{float:right;margin:2px 0 6px 14px}
#ed img.b{display:block;float:none;margin:8px auto}
#ed img.sel{outline:3px solid #00e5ff}
#cellbar,#txtbar{position:fixed;left:0;top:0;display:none;z-index:20;gap:6px;padding:6px;background:#10162a;border-radius:10px;box-shadow:0 2px 12px #000a;flex-wrap:nowrap;white-space:nowrap}
#cellbar.on,#txtbar.on{display:flex}
#cellbar button,#txtbar button{font-size:15px;padding:8px 12px;white-space:nowrap}
#fmtbar,#colbar{display:none;background:#fff;padding:8px;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:2px solid #00e5ff55}
#fmtbar.on,#colbar.on{display:flex}
#fmtbar span{color:#222;font-size:15px;font-weight:bold}
#colbar{padding-top:4px}
#colbar .sw{width:40px;height:40px;padding:0;border-radius:50%;border:2px solid #999;flex:0 0 auto}
#bFmt{background:#00897b}
#bTbl{background:#6d4c41}
#tblbar{display:none;background:#fff;padding:8px;gap:10px;align-items:center;flex-wrap:wrap;border-top:2px solid #00e5ff55}
#tblbar.on{display:flex}
#tblbar span{color:#222;font-size:15px;font-weight:bold}
#tblbar .num{min-width:34px;text-align:center;color:#111;font-size:20px;font-weight:bold}
#tblbar .st{padding:8px 16px;font-size:22px;line-height:1}
#tblbar .st:disabled{opacity:.3}
#ed table{border-collapse:collapse;margin:8px 0}
/* chữ đầy ô thì tự xuống dòng trong ô, ô giãn dài xuống dưới */
#ed td,#ed th{overflow-wrap:anywhere;word-break:break-word;vertical-align:top}
/* tay nắm kéo đổi bề ngang cột / chiều cao dòng / phóng to thu nhỏ cả bảng */
#tz>div{position:fixed;z-index:3;touch-action:none;-webkit-user-select:none;user-select:none}
#tz .vc{width:14px;cursor:col-resize}
#tz .vc:after{content:"";position:absolute;left:5px;top:0;bottom:0;width:4px;background:#1e88e5;opacity:.8;border-radius:2px}
#tz .hr{height:14px;cursor:row-resize}
#tz .hr:after{content:"";position:absolute;top:5px;left:0;right:0;height:4px;background:#1e88e5;opacity:.8;border-radius:2px}
#tz .cn{width:28px;height:28px;border-radius:6px;background:#1e88e5;border:2px solid #fff;box-sizing:border-box;cursor:nwse-resize;box-shadow:0 1px 5px #0008;z-index:5}
#tz .cn:after{content:"⤡";position:absolute;left:0;right:0;top:0;bottom:0;color:#fff;font-size:16px;line-height:24px;text-align:center}
#ed td.csel{background:rgba(30,136,229,.25);box-shadow:inset 0 0 0 2px #1e88e5}
#ed.cdrag,#ed.cdrag *{-webkit-user-select:none;user-select:none}
#tz .rs{width:10px;background:rgba(30,136,229,.4);border-radius:3px;cursor:pointer}
#tz .cs{height:10px;background:rgba(30,136,229,.4);border-radius:3px;cursor:pointer}
#ctxbar{position:fixed;left:0;top:0;display:none;z-index:19;gap:6px;padding:5px;background:#10162a;border-radius:10px;box-shadow:0 2px 12px #000a;white-space:nowrap}
#ctxbar.on{display:flex}
#ctxbar button{font-size:14px;padding:6px 10px;white-space:nowrap}
#tplus button{position:fixed;z-index:4;width:28px;height:28px;padding:0;border-radius:50%;border:2px solid #fff;background:#00897b;color:#fff;font-size:20px;line-height:22px;text-align:center;box-shadow:0 1px 5px #0008}
</style></head><body>
<div id="top">
  <button class="i" id="bList">📂 List</button>
  <button id="bFmt">🔤 Định dạng</button>
  <button class="n" id="bCam">📷 Chụp</button>
  <button id="bTbl">▦ Bảng</button>
  <button class="i" id="bPaste">🖼 Dán</button>
  <input id="title" placeholder="Tiêu đề">
  <button class="s" id="bSave">💾 Lưu</button>
  <span style="flex:0 0 100%;height:0"></span>
  <button id="bUndo" title="Hoàn tác (Ctrl+Z)">↶ Hoàn tác</button><button id="bRedo" title="Làm lại (Ctrl+Y)">↷</button>
  <button class="c" id="bCopy">📋 Copy</button>
  <button class="i" id="bPasteTxt">Dán 📄</button>
</div>
<div id="imgbar">
  <span>Ảnh:</span>
  <button id="pL">◀ Trái</button><button id="pB">▣ Giữa</button><button id="pR">Phải ▶</button>
  <button id="zM">− Nhỏ</button><button id="zP">+ Lớn</button>
  <button class="n" id="kI">✂ Cắt</button>
  <button class="c" id="cI">📋 Copy ảnh</button>
  <button class="d" id="dI">🗑 Xoá ảnh</button>
  <button id="xI">✔ Xong</button>
</div>
<div id="fmtbar">
  <span>Định dạng:</span>
  <button id="fL">◀ Trái</button><button id="fC">▣ Giữa</button><button id="fR">Phải ▶</button>
  <button id="fSm">− Nhỏ</button><button id="fBig">+ Lớn</button>
  <button id="fColor">🎨 Màu</button>
  <button id="fU">Gạch chân</button><button id="fB">In đậm</button><button id="fI">In nghiêng</button>
  <button id="fDone">✔ Xong</button>
</div>
<div id="colbar">
  <button class="sw" data-c="#e53935" style="background:#e53935" title="Đỏ"></button>
  <button class="sw" data-c="#1e88e5" style="background:#1e88e5" title="Xanh dương"></button>
  <button class="sw" data-c="#43a047" style="background:#43a047" title="Xanh lá"></button>
  <button class="sw" data-c="#fdd835" style="background:#fdd835" title="Vàng"></button>
  <button class="sw" data-c="#f06292" style="background:#f06292" title="Hồng"></button>
  <button class="sw" data-c="#000000" style="background:#000000" title="Đen"></button>
  <button class="sw" data-c="#ffffff" style="background:#ffffff" title="Trắng"></button>
  <button class="sw" data-c="#fb8c00" style="background:#fb8c00" title="Cam"></button>
  <button class="sw" data-c="#8e24aa" style="background:#8e24aa" title="Tím"></button>
  <button class="sw" data-c="#6d4c41" style="background:#6d4c41" title="Nâu"></button>
  <button id="colOff" style="background:#555">✕ Tắt màu</button>
</div>
<div id="list"><div id="lh"><span>Ghi chú đã lưu</span><button class="n" id="bLsNew">➕ Ghi chú mới</button></div><div id="lb"></div></div>
<div id="txtbar"><button class="n" id="tCut">✂ Cắt</button><button class="c" id="tCopy">📋 Copy</button><button class="i" id="tPaste">Dán 📄</button><button class="d" id="tDel">🗑 Xoá</button><button class="s" id="tAll">☑ Chọn tất cả</button></div>
<div id="cellbar"><button class="d" id="cDel" style="display:none">🗑 Xóa dòng</button><button class="d" id="cDelC" style="display:none">🗑 Xóa cột</button><button class="s" id="cMerge">⊞ Gộp ô</button><button class="s" id="cSplit" style="display:none">⊟ Tách ô</button><button class="c" id="cFmt">🔤 Định dạng</button><button class="n" id="cUndo">↶ Hoàn tác</button><button class="d" id="cTbl">🗑 Xóa bảng</button><button class="d" id="cOff">✕ Bỏ chọn</button></div>
<div id="ctxbar"><button class="s" id="xSplit" style="display:none">⊟ Tách ô</button><button class="d" id="xTbl">🗑 Xóa bảng</button></div>
<div id="wrap"><div id="ed" contenteditable="true" data-ph="Gõ ghi chú ở đây... Dán ảnh: ảnh nằm trái/phải thì chữ chạy bên cạnh ảnh"></div></div>
<div id="tplus"></div>
<div id="tz"></div>
<div id="tblbar">
  <span>Cột:</span><button class="st" id="cMinus">−</button><span class="num" id="cNum">1</span><button class="st" id="cPlus">+</button>
  <span>Dòng:</span><button class="st" id="rMinus">−</button><span class="num" id="rNum">1</span><button class="st" id="rPlus">+</button>
  <button class="s" id="tblOk">✔ Chèn bảng</button><button id="tblX">✕ Đóng</button>
</div>
<script>
var ed=document.getElementById('ed'),ti=document.getElementById('title'),bar=document.getElementById('imgbar');
var sel=null,saved=null,tmr=null;
function A(){return window.AndroidNote}
function $(id){return document.getElementById(id)}

document.addEventListener('selectionchange',function(){
  var s=getSelection();
  if(s.rangeCount&&ed.contains(s.anchorNode))saved=s.getRangeAt(0).cloneRange();
});

function cleanHtml(){
  var c=ed.cloneNode(true);
  c.querySelectorAll('img.sel').forEach(function(i){i.classList.remove('sel')});
  c.querySelectorAll('.csel').forEach(function(x){x.classList.remove('csel');if(!x.getAttribute('class'))x.removeAttribute('class')});
  return c.innerHTML;
}
function schedule(){clearTimeout(tmr);tmr=setTimeout(function(){flush(false)},1500);try{uHook()}catch(_){}}
function flush(manual){
  clearTimeout(tmr);
  if(!A())return;
  A().save(ti.value,cleanHtml(),ed.innerText||'',ed.querySelector('img')?1:0,manual?1:0);
}

function unselect(){if(sel)sel.classList.remove('sel');sel=null;bar.style.display='none'}
function select(img){
  if(sel)sel.classList.remove('sel');
  sel=img;img.classList.add('sel');bar.style.display='flex';
}

/* thu nhỏ ảnh quá lớn trước khi chèn */
function shrink(src,cb){
  var im=new Image();
  im.onload=function(){
    var M=1280,w=im.naturalWidth,h=im.naturalHeight;
    if(w<=M&&h<=M&&src.length<900000){cb(src);return}
    var k=Math.min(1,M/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.round(w*k);c.height=Math.round(h*k);
    var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
    var png=/^data:image\/png/.test(src);
    cb(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.85));
  };
  im.onerror=function(){cb(src)};
  im.src=src;
}
/* Vị trí con trỏ được chốt NGAY lúc bấm nút (Chụp / Dán...). Sau khi camera đóng, trang lấy lại tiêu điểm
   và có thể tự đặt con trỏ về đầu ghi chú -> nếu dùng 'saved' lúc đó thì ảnh dán sai chỗ. */
var hold=null;
function holdPoint(){
  var s=getSelection();
  if(s.rangeCount&&ed.contains(s.anchorNode))hold=s.getRangeAt(0).cloneRange();
  else if(saved&&ed.contains(saved.startContainer))hold=saved.cloneRange();
}
['pointerdown','mousedown','touchstart'].forEach(function(ev){
  $('top').addEventListener(ev,function(e){if(e.target&&e.target.closest&&e.target.closest('button'))holdPoint()},true);
});
/* đưa con trỏ về đúng chỗ đã chốt; trả về vùng chọn đó */
function restoreCaret(){
  var r=hold||saved;hold=null;
  ed.focus();
  var g=getSelection();
  if(r&&ed.contains(r.startContainer)){g.removeAllRanges();g.addRange(r);return r}
  var e=document.createRange();e.selectNodeContents(ed);e.collapse(false);
  g.removeAllRanges();g.addRange(e);return e;
}
/* ảnh luôn nằm ĐẦU một dòng riêng, tại đúng chỗ con trỏ: chữ gõ tiếp nằm ngang hàng bên cạnh ảnh, ảnh không bị đẩy xuống */
function putImgAtCaret(r,img){
  var root=cellOf(r.startContainer)||ed;
  var m=marker(r.startContainer,r.startOffset);
  flattenLines(root);
  var line=lineOf(m,root);
  if(!line||line.nodeType!==1||!LINE.test(line.nodeName)){
    m.parentNode.insertBefore(img,m);m.parentNode.removeChild(m);return;
  }
  var b=document.createRange();b.setStart(line,0);b.setEndBefore(m);
  var hasBefore=/\S/.test(b.toString())||!!b.cloneContents().querySelector('img');
  var a=document.createRange();a.setStartAfter(m);a.setEnd(line,line.childNodes.length);
  var hasAfter=/\S/.test(a.toString())||!!a.cloneContents().querySelector('img');
  var blk=line;
  if(hasBefore){
    if(hasAfter){splitLine(m,false,root);blk=line.nextSibling}
    else{blk=document.createElement('div');blk.appendChild(document.createElement('br'));line.parentNode.insertBefore(blk,line.nextSibling)}
  }
  m.parentNode.removeChild(m);
  blk.insertBefore(img,blk.firstChild);
  if(!blk.querySelector('br')&&!/\S/.test(blk.textContent))blk.appendChild(document.createElement('br'));
}
/* ảnh nổi trái/phải mà trước nó (cùng khối) có chữ -> trình duyệt đẩy ảnh xuống dòng dưới: đưa ảnh về đầu khối */
function normFloats(){
  var s=getSelection();
  if(s.rangeCount&&s.anchorNode&&s.anchorNode.nodeType!==3)return;     /* con trỏ không nằm trong chữ: đừng đụng vào */
  Array.prototype.forEach.call(ed.querySelectorAll('img.l,img.r'),function(im){
    var p=im.parentNode;
    if(!p||p===ed||!LINE.test(p.nodeName))return;
    for(var n=im.previousSibling;n;n=n.previousSibling){
      var has=n.nodeType===3?/\S/.test(n.data):(n.nodeType===1&&n.nodeName!=='IMG'&&n.nodeName!=='BR'&&/\S/.test(n.textContent));
      if(has){p.insertBefore(im,p.firstChild);return}
    }
  });
}
function insertImg(src,selectIt){
  shrink(src,function(s){
    hideList();                                      /* đang ở trang danh sách thì quay lại trang soạn để thấy ảnh */
    var r=restoreCaret();
    var img=document.createElement('img');
    img.className='l';img.style.width='30%';img.src=s;
    putImgAtCaret(r,img);
    var nr=document.createRange();nr.setStartAfter(img);nr.collapse(true);
    var g=getSelection();g.removeAllRanges();g.addRange(nr);
    saved=nr.cloneRange();
    if(selectIt)select(img);
    schedule();
  });
}
/* ảnh vừa chụp: chèn vào ghi chú và chọn sẵn để bấm ✂ Cắt */
function insertPhoto(src){insertImg(src,true)}
/* thay ảnh đang chọn bằng ảnh đã cắt */
function replaceSelImg(src){
  if(!sel){insertImg(src,true);return}
  sel.src=src;schedule();
}
/* chèn chữ lấy từ bộ nhớ tạm vào chỗ con trỏ */
function insertText(t){
  restoreCaret();
  document.execCommand('insertText',false,t);
  schedule();
}

ed.addEventListener('input',function(){normFloats();schedule()});
ti.addEventListener('input',schedule);
ed.addEventListener('paste',function(e){
  var cd=e.clipboardData;if(!cd)return;
  var files=[];
  for(var i=0;i<cd.items.length;i++){var it=cd.items[i];if(it.kind==='file'&&it.type.indexOf('image/')===0)files.push(it.getAsFile())}
  e.preventDefault();
  if(files.length){
    files.forEach(function(f){var r=new FileReader();r.onload=function(){insertImg(r.result)};r.readAsDataURL(f)});
    return;
  }
  var t=cd.getData('text/plain');
  if(t)document.execCommand('insertText',false,t);
  else if(A())A().pasteImage();
  schedule();
});
ed.addEventListener('click',function(e){
  if(e.target&&e.target.tagName==='IMG')select(e.target);else unselect();
});

function setPos(p){if(!sel)return;sel.className=p+' sel';normFloats();schedule()}
function size(d){
  if(!sel)return;
  var w=parseFloat(sel.style.width)||30;
  sel.style.width=Math.max(8,Math.min(100,w+d))+'%';schedule();
}
$('pL').onclick=function(){setPos('l')};
$('pR').onclick=function(){setPos('r')};
$('pB').onclick=function(){setPos('b')};
$('zM').onclick=function(){size(-8)};
$('zP').onclick=function(){size(8)};
$('xI').onclick=unselect;
$('dI').onclick=function(){if(sel){sel.remove();unselect();schedule()}};
$('cI').onclick=function(){if(sel&&A())A().copyImage(sel.src)};
$('kI').onclick=function(){if(sel&&A())A().cropImage(sel.src)};

function newNote(){
  flush(false);
  if(!A())return;
  closeFmt();plusHide();tzHide();cellClear();
  ti.value=A().newTitle();
  ed.innerHTML='';unselect();saved=null;uReset();
};
/* Con trỏ (chuột remote) vẫn đặt con trỏ / chọn chữ bình thường trong ô.
   Đã bỏ nút bật/tắt bàn phím riêng của Ghi chú (dùng bàn phím ảo nổi ⌨ trên thanh dưới); bàn phím hệ thống luôn ẩn. */
var kbOn=false;
function kbUI(){
  var m=kbOn?'text':'none';
  ed.setAttribute('inputmode',m);ti.setAttribute('inputmode',m);
}
function leftEditing(){
  setTimeout(function(){
    if(document.activeElement!==ed&&document.activeElement!==ti){kbOn=false;kbUI()}
  },0);
}
function onEditFocus(){ if(!kbOn&&A()) try{A().hideIme()}catch(e){} }
ed.addEventListener('focus',onEditFocus);
ti.addEventListener('focus',onEditFocus);
ed.addEventListener('blur',leftEditing);
ti.addEventListener('blur',leftEditing);
kbUI();
$('bSave').onclick=function(){flush(true);showList()};   /* lưu ngay (ghi tệp đồng bộ) rồi về trang danh sách */
$('bCopy').onclick=function(){if(A())A().copy(ed.innerText||'',cleanHtml())};
$('bPaste').onclick=function(){if(!hold)holdPoint();if(A())A().pasteImage()};
$('bPasteTxt').onclick=function(){if(!hold)holdPoint();if(A())A().pasteText()};
$('bCam').onclick=function(){if(!hold)holdPoint();if(A())A().openCamera()};

/* gọi từ ứng dụng */
function loadNote(title,html){closeFmt();plusHide();tzHide();cellClear();hideList();ti.value=title;ed.innerHTML=html;unselect();saved=null;uReset()}
function showList(){
  if(!A())return;
  closeFmt();plusHide();tzHide();cellClear();
  flush(false);
  var arr=[];try{arr=JSON.parse(A().list())}catch(e){}
  var b=$('lb');b.innerHTML='';
  if(!arr.length){var p=document.createElement('div');p.className='e';p.textContent='Chưa có ghi chú nào.';b.appendChild(p)}
  arr.forEach(function(n){
    var row=document.createElement('div');row.className='row';
    var x=document.createElement('button');x.className='nm';
    x.textContent='📝 '+n.name+'   ('+n.time+')';
    x.onclick=function(){hideList();if(A())A().open(n.name)};
    var c=document.createElement('button');c.className='c';c.textContent='📋 Copy';
    c.onclick=function(){
      if(!A())return;
      A().copyNote(n.name);
      c.textContent='✔ Đã copy';
      setTimeout(function(){c.textContent='📋 Copy'},1500);
    };
    var d=document.createElement('button');d.className='d';d.textContent='🗑 Xoá';

/* ---- định dạng: căn lề, cỡ chữ, màu, gạch chân, in đậm, in nghiêng (chỉ áp dụng đúng phần đang quét khối) ---- */
var fmtOn=false,fmtTarget=null,fmtSoft=false,ptrDown=false,fmtCells='';

var BLK=/^(DIV|P|H[1-6]|UL|OL|LI|TABLE|BLOCKQUOTE|PRE|IMG)$/;

/* các đoạn chữ THẬT SỰ nằm trong vùng quét (đầu dòng kế tiếp mà không có chữ nào thì không tính) */
function selTexts(r){
  var out=[],w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT),n;
  while((n=w.nextNode())){
    if(!r.intersectsNode(n))continue;

/* ô bảng chứa nút n (nếu có) */
function cellOf(n){

  return null;
}
/* dòng (con trực tiếp của root) chứa nút n */
function lineOf(n,root){
  while(n&&n.parentNode!==root)n=n.parentNode;
  return n;
}
/* chữ/thẻ nằm trần được bọc vào <div>, mỗi <br> kết thúc một dòng */
function wrapInline(root){
  var run=null;
  Array.prototype.slice.call(root.childNodes).forEach(function(n){
    if(n.nodeType===1&&BLK.test(n.nodeName)){run=null;return}
    if(!run){
      if(n.nodeType===3&&/^[\r\n]*$/.test(n.data))return;

/* đưa nội dung root về dạng mỗi dòng là một khối riêng (không lồng nhau, không gộp bằng <br>) */
function flattenLines(root){
  wrapInline(root);
  var c=root.firstElementChild;
  while(c){
    var nested=LINE.test(c.nodeName)&&Array.prototype.some.call(c.children,function(k){return k.nodeName!=='IMG'&&BLK.test(k.nodeName)});
    if(!nested){c=c.nextElementSibling;continue}
    wrapInline(c);
    var head=null,css=c.style.cssText;
    while(c.firstChild){
      var k=c.firstChild;
      if(k.nodeType===1){if(css&&k.nodeName!=='IMG')k.style.cssText=css+';'+k.style.cssText;if(!head)head=k}
      root.insertBefore(k,c);
    }
    var nx=c.nextElementSibling;root.removeChild(c);c=head||nx;
  }
  for(c=root.firstElementChild;c;c=c.nextElementSibling){
    if(!LINE.test(c.nodeName))continue;
    var brs=c.querySelectorAll('br');
    for(var i=0;i<brs.length;i++){
      var x=document.createRange();x.setStartAfter(brs[i]);x.setEnd(c,c.childNodes.length);
      var f=x.cloneContents();
      if(!f.textContent.length&&!f.querySelector('br,img,[data-m]'))continue;
      var nb=c.cloneNode(false);nb.appendChild(x.extractContents());
      c.parentNode.insertBefore(nb,c.nextSibling);

    }

function marker(node,off){

/* cắt dòng tại mốc m (before=true: phần trước m ở lại dòng cũ), chỉ cắt khi phía bị tách ra có chữ/ảnh */
function splitLine(m,before,root){
  var B=lineOf(m,root);

  var x=document.createRange();
  if(before){x.setStart(B,0);x.setEndBefore(m)}else{x.setStartAfter(m);x.setEnd(B,B.childNodes.length)}
  var f=x.cloneContents();
  if(!/\S/.test(f.textContent)&&!f.querySelector('img'))return;
  if(before){x.setStartBefore(m);x.setEnd(B,B.childNodes.length)}
  var nb=B.cloneNode(false);              /* giữ nguyên căn lề cũ cho phần bị cắt ra */

function fmtCellsApply(each){

/* đặt cỡ chữ nw cho đúng phần chữ trong vùng x */
function sizeRange(x,nw){

  if(!nodes.length)return;
  nodes.forEach(function(n){
    var el=n,p;
    /* thẻ định dạng chỉ chứa đúng đoạn này thì đổi cỡ ở lớp ngoài cùng (gạch chân nằm đúng dưới chữ) */

  nr.setStart(nodes[0],0);nr.setEnd(z,z.length);

/* dòng, cột bắt đầu của ô */
function cellPos(g,td){
  for(var r=0;r<g.length;r++)for(var c=0;c<g[r].length;c++)if(g[r][c]===td)return {r:r,c:c};
  return null;
}
function newCell(){var d=document.createElement('td');d.setAttribute('style',TCELL);d.innerHTML='<br>';return d}
/* chèn cột vào đường kẻ thứ i; ô gộp nằm vắt qua đường kẻ thì giãn thêm 1 cột */
function addCol(t,i){
  var g=grid(t),wide=[],adds=[];
  Array.prototype.forEach.call(t.rows,function(tr,r){
    var a=g[r][i-1],b=g[r][i];
    if(a&&a===b){if(wide.indexOf(a)<0)wide.push(a);return}
    var ref=null;
    for(var k=0;k<tr.cells.length;k++)if(cellPos(g,tr.cells[k]).c>=i){ref=tr.cells[k];break}
    adds.push([tr,ref]);
  });
  adds.forEach(function(x){x[0].insertBefore(newCell(),x[1])});
  wide.forEach(function(td){td.style.width='';td.style.minWidth='70px';td.colSpan++});
  var cg=t.querySelector('colgroup');
  if(cg){
    var nc=document.createElement('col');nc.style.width='90px';
    cg.insertBefore(nc,cg.children[i]||null);
    if(t.style.width)t.style.width=((parseFloat(t.style.width)||0)+90)+'px';
  }
}
/* chèn dòng vào đường kẻ thứ i */
function addRow(t,i){
  var g=grid(t),tr=document.createElement('tr'),tall=[],c;
  for(c=0;c<g.cols;c++){
    var a=i>0?g[i-1][c]:null,b=g[i]?g[i][c]:null;
    if(a&&a===b){if(tall.indexOf(a)<0)tall.push(a)}
    else tr.appendChild(newCell());
  }
  var rows=t.rows,ref=rows[i]||null,par=(ref||rows[rows.length-1]).parentNode;
  par.insertBefore(tr,ref);
  tall.forEach(function(td){td.style.height='';td.rowSpan++});
}

/* ---- chạm ô ở hàng đầu: dấu + trên mép trên bảng (thêm cột); chạm ô ở cột đầu: dấu + bên mép trái (thêm dòng) ---- */
var tp={cell:null,timer:null};
function plusHide(){tp.cell=null;clearInterval(tp.timer);tp.timer=null;$('tplus').innerHTML=''}
function plusDraw(){
  var c=tp.cell,box=$('tplus');
  if(!c||!ed.contains(c)){plusHide();return}
  var t=c.closest('table'),g=grid(t),at=cellPos(g,c),pts=[],i,r,b;
  var view=$('wrap').getBoundingClientRect(),tr=t.getBoundingClientRect();
  if(at.r===0&&g.cols<TMAX){
    for(i=0;i<=g.cols;i++){
      for(r=0;r<g.length;r++){          /* tìm một ô có cạnh nằm đúng trên đường kẻ này */
        var L=g[r][i],R=g[r][i-1];
        if(L===R)continue;
        if(L){b=L.getBoundingClientRect();pts.push({k:'c',i:i,x:b.left,y:tr.top});break}
        if(R){b=R.getBoundingClientRect();pts.push({k:'c',i:i,x:b.right,y:tr.top});break}
      }
    }
  }
  if(at.c===0){
    var rows=t.rows;
    for(i=0;i<=rows.length;i++){
      b=rows[Math.min(i,rows.length-1)].getBoundingClientRect();
      pts.push({k:'r',i:i,x:tr.left,y:i<rows.length?b.top:b.bottom});
    }
  }
  /* góc trên trái có cả hai loại dấu +: tách ra để không đè lên nhau */
  pts.forEach(function(p){if(p.i===0&&at.r===0&&at.c===0){if(p.k==='c')p.x+=14;else p.y+=14}});
  pts=pts.filter(function(p){return p.x>=view.left&&p.x<=view.right&&p.y>=view.top&&p.y<=view.bottom});
  while(box.children.length>pts.length)box.removeChild(box.lastChild);
  pts.forEach(function(p,n){
    var el=box.children[n];
    if(!el){el=document.createElement('button');el.textContent='+';box.appendChild(el)}
    el.setAttribute('data-k',p.k);el.setAttribute('data-i',p.i);
    el.title=p.k==='c'?'Thêm cột':'Thêm dòng';
    el.style.left=(p.x-14)+'px';el.style.top=(p.y-14)+'px';
  });
}
$('tplus').addEventListener('mousedown',function(e){e.preventDefault()});
$('tplus').addEventListener('pointerdown',function(e){e.preventDefault()});
$('tplus').addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b||!tp.cell||!ed.contains(tp.cell))return;
  var t=tp.cell.closest('table'),i=+b.getAttribute('data-i');
  cellClear();uOp();
  if(b.getAttribute('data-k')==='c')addCol(t,i);else addRow(t,i);
  schedule();plusDraw();
});
ed.addEventListener('click',function(e){
  var c=e.target&&e.target.closest?e.target.closest('td,th'):null;
  if(!c||!ed.contains(c)){plusHide();tzHide();return}
  tzShow(c.closest('table'));
  var at=cellPos(grid(c.closest('table')),c);
  if(at.r!==0&&at.c!==0){plusHide();return}
  tp.cell=c;plusDraw();
  if(!tp.timer)tp.timer=setInterval(plusDraw,250);   /* bám theo bảng khi gõ chữ làm ô giãn ra, đổi bố cục */
});
document.addEventListener('scroll',function(){if(tp.cell)plusDraw()},true);
ed.addEventListener('input',function(){if(tp.cell)plusDraw()});
ti.addEventListener('focus',plusHide);

/* ---- chọn ô: nhấn vào ô trống rồi vuốt trái/phải/lên/xuống để chọn các ô thẳng hàng, sau đó gộp / định dạng ---- */
function cellKey(){
  return csel.cells.map(function(c){var t=c.closest('table');return t?Array.prototype.indexOf.call(ed.querySelectorAll('td,th'),c):-1}).join(',');
}
function isEmptyCell(c){return !c.textContent.replace(/[\s​]/g,'')&&!c.querySelector('img,table')}
function cellAt(x,y){
  var n=document.elementFromPoint(x,y),c=n&&n.closest?n.closest('td,th'):null;
  return c&&ed.contains(c)?c:null;
}
function cellMark(list,dir,rect){
  ed.querySelectorAll('.csel').forEach(function(c){c.classList.remove('csel');if(!c.getAttribute('class'))c.removeAttribute('class')});
  list.forEach(function(c){c.classList.add('csel')});
  csel.cells=list;csel.dir=dir||'';csel.rect=rect||null;csel.pin=false;
  if(list.length)tzShow(list[0].closest('table'));
}
function cellBar(){
  var bar=$('cellbar'),l=csel.cells;
  if(l.some(function(c){return !ed.contains(c)})){cellMark([]);l=csel.cells}
  if((l.length<2&&!csel.pin)||!l.length||csel.drag||fmtOn||$('list').classList.contains('on')){bar.classList.remove('on');return}
  bar.classList.add('on');
  $('cMerge').style.display=l.length>1?'':'none';
  $('cSplit').style.display=l.some(function(c){return c.colSpan>1||c.rowSpan>1})?'':'none';
  var dl=$('cDel'),dc=$('cDelC'),R=csel.rect,nr=R?R.r2-R.r1+1:1,nc=R?R.c2-R.c1+1:1,dr=csel.dir;
  dl.style.display=(dr==='h'||dr==='r')?'':'none';dl.textContent='🗑 Xóa '+(nr>1?nr+' ':'')+'dòng';
  dc.style.display=(dr==='v'||dr==='r')?'':'none';dc.textContent='🗑 Xóa '+(nc>1?nc+' ':'')+'cột';
  var a=l[0].getBoundingClientRect(),z=l[l.length-1].getBoundingClientRect(),w=bar.offsetWidth,h=bar.offsetHeight;
  var top=Math.max(a.bottom,z.bottom)+8;
  if(top+h>innerHeight-4)top=Math.min(a.top,z.top)-h-8;
  if(top<4)top=Math.max(4,innerHeight-h-4);
  var left=(a.left+z.right)/2-w/2;left=Math.max(4,Math.min(left,innerWidth-w-4));
  bar.style.top=top+'px';bar.style.left=left+'px';
}
function cellClear(){
  if(!csel.cells.length&&!csel.drag)return;
  csel.drag=null;ed.classList.remove('cdrag');cellMark([]);cellBar();
}
function cellCaret(c){
  ed.focus();
  getSelection().collapse(c,0);
}
/* bắt đầu nhấn: ô trống thì chọn ngay; ô có chữ chỉ chuyển sang chọn ô khi kéo sang ô khác */
function cellDown(c,x,y){
  cellClear();
  if(!c)return false;
  var empty=isEmptyCell(c);
  csel.drag={a:c,x:x,y:y,on:empty};
  if(empty){ed.classList.add('cdrag');cellMark([c]);plusHide()}
  return empty;
}
/* kéo tới điểm (x,y): chọn các ô thẳng một hàng ngang hoặc một cột dọc tính từ ô bắt đầu */
function cellMove(x,y){
  var d=csel.drag;if(!d)return;
  var b=cellAt(x,y);
  if(!b||b.closest('table')!==d.a.closest('table'))return;
  if(!d.on){
    if(b===d.a)return;
    d.on=true;ed.classList.add('cdrag');plusHide();
  }
  if(b===d.a){cellMark([d.a]);return}
  var g=grid(d.a.closest('table')),p=cellPos(g,d.a),q=cellPos(g,b);
  var sameR=q.r<p.r+d.a.rowSpan&&p.r<q.r+b.rowSpan,sameC=q.c<p.c+d.a.colSpan&&p.c<q.c+b.colSpan;
  var list=[],i,j,from,to,c,r1,r2,c1,c2;
  if(!sameR&&!sameC){
    /* kéo chéo sang ô khác dòng, khác cột: chọn cả khối chữ nhật => chọn được nhiều dòng / nhiều cột */
    r1=Math.min(p.r,q.r);r2=Math.max(p.r+d.a.rowSpan-1,q.r+b.rowSpan-1);
    c1=Math.min(p.c,q.c);c2=Math.max(p.c+d.a.colSpan-1,q.c+b.colSpan-1);
    var ch=true,rr,cc,td,tp;
    while(ch){
      ch=false;
      for(rr=r1;rr<=r2;rr++)for(cc=c1;cc<=c2;cc++){
        td=g[rr]&&g[rr][cc];if(!td)continue;
        tp=cellPos(g,td);
        if(tp.r<r1){r1=tp.r;ch=true}
        if(tp.r+td.rowSpan-1>r2){r2=Math.min(g.length-1,tp.r+td.rowSpan-1);ch=true}
        if(tp.c<c1){c1=tp.c;ch=true}
        if(tp.c+td.colSpan-1>c2){c2=tp.c+td.colSpan-1;ch=true}
      }
    }
    for(i=r1;i<=r2;i++)for(j=c1;j<=c2;j++){
      c=g[i]&&g[i][j];
      if(c&&list.indexOf(c)<0)list.push(c);
    }
    cellMark(list,'r',{r1:r1,r2:r2,c1:c1,c2:c2});
    return;
  }
  var hor=sameR&&!sameC?true:sameC&&!sameR?false:Math.abs(x-d.x)>=Math.abs(y-d.y);
  if(hor){from=Math.min(p.c,q.c);to=Math.max(p.c+d.a.colSpan-1,q.c+b.colSpan-1)}
  else{from=Math.min(p.r,q.r);to=Math.max(p.r+d.a.rowSpan-1,q.r+b.rowSpan-1)}
  for(i=from;i<=to;i++){
    c=hor?g[p.r][i]:(g[i]&&g[i][p.c]);
    if(c&&list.indexOf(c)<0)list.push(c);
  }
  cellMark(list,hor?'h':'v',hor?{r1:p.r,r2:p.r,c1:from,c2:to}:{r1:from,r2:to,c1:p.c,c2:p.c});
}
function cellUp(){
  var d=csel.drag;if(!d)return;
  csel.drag=null;ed.classList.remove('cdrag');
  if(d.on){
    cellCaret(csel.cells[0]||d.a);
    if(fmtOn&&fmtCells!==cellKey())closeFmt();      /* quét chọn ô khác: tắt thanh định dạng */
  }
  cellBar();
}
ed.addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  var c=e.target.closest?e.target.closest('td,th'):null;
  if(cellDown(c,e.clientX,e.clientY)){e.preventDefault();cellCaret(c)}
});
document.addEventListener('mousemove',function(e){
  if(!csel.drag)return;
  if(e.buttons===0){cellUp();return}
  cellMove(e.clientX,e.clientY);
  if(csel.drag.on){e.preventDefault();cellCaret(csel.drag.a)}
});
document.addEventListener('mouseup',cellUp);
ed.addEventListener('touchstart',function(e){
  if(e.touches.length!==1)return;
  var t=e.touches[0],c=e.target.closest?e.target.closest('td,th'):null;
  if(c&&isEmptyCell(c)){clearTimeout(touchSel.timer);touchSel.mode=0;cellDown(c,t.clientX,t.clientY)}
},{passive:true});
ed.addEventListener('touchmove',function(e){
  var t=e.touches[0];
  if(touchSel.mode===2&&!csel.drag){            /* đang quét chữ mà kéo sang ô khác: chuyển sang chọn ô */
    var a=touchSel.anc.n,ac=cellOf(a),b=cellAt(t.clientX,t.clientY);
    if(ac&&b&&b!==ac){touchSel.mode=0;csel.drag={a:ac,x:touchSel.sx,y:touchSel.sy,on:false}}
  }
  if(!csel.drag)return;
  e.preventDefault();                           /* đang chọn ô: không cuộn trang */
  cellMove(t.clientX,t.clientY);
},{passive:false});
ed.addEventListener('touchend',cellUp);
ed.addEventListener('touchcancel',cellUp);
/* bàn phím vật lý: Delete / Backspace khi đang chọn nhiều ô => xoá sạch nội dung các ô đã chọn (giữ nguyên ô và vùng chọn) */
ed.addEventListener('keydown',function(e){
  if((e.key!=='Delete'&&e.key!=='Backspace')||csel.drag||csel.cells.length<2)return;
  if(csel.cells.some(function(c){return !ed.contains(c)}))return;
  e.preventDefault();e.stopPropagation();
  uOp();
  csel.cells.forEach(function(c){c.innerHTML='<br>'});
  cellCaret(csel.cells[0]);
  cellBar();schedule();
},true);
ed.addEventListener('input',function(){if(!csel.busy)cellClear()});
ti.addEventListener('focus',cellClear);
document.addEventListener('scroll',cellBar,true);
window.addEventListener('resize',cellBar);

/* gộp các ô đang chọn (phải thẳng hàng: cùng dòng và cao bằng nhau, hoặc cùng cột và rộng bằng nhau) */
function cellMergeRect(){
  uOp();
  var l=csel.cells.slice(),R=csel.rect,g=grid(l[0].closest('table')),r,c,ok=true;
  for(r=R.r1;r<=R.r2&&ok;r++)for(c=R.c1;c<=R.c2;c++)if(!g[r]||!g[r][c]){ok=false;break}
  if(!ok){if(A())A().toast('Các ô phải tạo thành hình chữ nhật mới gộp được');return}
  var first=l[0],L=1e9,T=1e9,Rt=-1e9,B=-1e9;
  l.forEach(function(x){var b=x.getBoundingClientRect();L=Math.min(L,b.left);T=Math.min(T,b.top);Rt=Math.max(Rt,b.right);B=Math.max(B,b.bottom)});
  l.slice(1).forEach(function(x){
    if(!isEmptyCell(x)){
      if(isEmptyCell(first))first.innerHTML='';
      var d=document.createElement('div');
      if(x.getAttribute('style'))d.setAttribute('style',x.getAttribute('style').replace(/(border|padding|min-width|width|height)[^;]*;?/g,''));
      while(x.firstChild)d.appendChild(x.firstChild);
      first.appendChild(d);
    }
    x.parentNode.removeChild(x);
  });
  first.colSpan=R.c2-R.c1+1;first.rowSpan=R.r2-R.r1+1;
  first.style.width=Math.max(0,Math.round(Rt-L)-18)+'px';first.style.height=Math.max(0,Math.round(B-T)-18)+'px';
  closeFmt();cellClear();plusHide();cellCaret(first);schedule();
}
function cellMerge(){
  var l=csel.cells.slice(),hor=csel.dir==='h';
  if(l.length<2)return;
  if(csel.dir==='r'){cellMergeRect();return}
  uOp();
  var g=grid(l[0].closest('table')),p=cellPos(g,l[0]),next=hor?p.c:p.r;
  var ok=l.every(function(c){
    var q=cellPos(g,c),fit=hor?(q.r===p.r&&c.rowSpan===l[0].rowSpan&&q.c===next):(q.c===p.c&&c.colSpan===l[0].colSpan&&q.r===next);
    next+=hor?c.colSpan:c.rowSpan;return fit;
  });
  if(!ok){if(A())A().toast('Các ô phải thẳng hàng mới gộp được');return}
  var first=l[0],a=first.getBoundingClientRect(),z=l[l.length-1].getBoundingClientRect();
  var span=0;l.forEach(function(c){span+=hor?c.colSpan:c.rowSpan});
  l.slice(1).forEach(function(c){
    if(!isEmptyCell(c)){
      if(isEmptyCell(first))first.innerHTML='';
      var d=document.createElement('div');
      if(c.getAttribute('style'))d.setAttribute('style',c.getAttribute('style').replace(/(border|padding|min-width|width|height)[^;]*;?/g,''));
      while(c.firstChild)d.appendChild(c.firstChild);
      first.appendChild(d);
    }
    c.parentNode.removeChild(c);
  });
  /* giữ nguyên kích thước vùng vừa gộp */
  if(hor){first.colSpan=span;first.style.width=Math.max(0,Math.round(z.right-a.left)-18)+'px'}
  else{first.rowSpan=span;first.style.height=Math.max(0,Math.round(z.bottom-a.top)-18)+'px'}
  closeFmt();cellClear();plusHide();cellCaret(first);schedule();
}
['cellbar'].forEach(function(id){
  var el=$(id);
  el.addEventListener('mousedown',function(e){e.preventDefault()});
  el.addEventListener('pointerdown',function(e){e.preventDefault()});
});
$('cMerge').onclick=cellMerge;
$('cFmt').onclick=function(){if(!fmtOn)$('bFmt').onclick()};
$('cOff').onclick=function(){closeFmt();cellClear()};

/* ---- xoá dòng / xoá cột đang quét chọn ---- */
function delRow(t,ri){
  var g=grid(t),rows=t.rows;
  if(rows.length<=1){t.parentNode.removeChild(t);return}
  var tr=rows[ri],seen=[],c;
  for(c=0;c<g.cols;c++){
    var td=g[ri]&&g[ri][c];
    if(!td||seen.indexOf(td)>=0)continue;
    seen.push(td);
    if(td.rowSpan>1){
      var p=cellPos(g,td);
      td.rowSpan--;td.style.height='';
      if(p.r===ri){                       /* ô bắt đầu ở dòng bị xoá và kéo dài xuống: dời xuống dòng kế */
        var nx=rows[ri+1],ref=null;
        for(var k=0;k<nx.cells.length;k++){var q=cellPos(g,nx.cells[k]);if(q.c>p.c){ref=nx.cells[k];break}}
        nx.insertBefore(td,ref);
      }
    }
  }
  tr.parentNode.removeChild(tr);
}
function delCol(t,ci){
  var g=grid(t);
  if(g.cols<=1){t.parentNode.removeChild(t);return}
  var seen=[];
  g.forEach(function(row){
    var td=row[ci];
    if(!td||seen.indexOf(td)>=0)return;
    seen.push(td);
    if(td.colSpan>1){td.colSpan--;td.style.width=''}else td.parentNode.removeChild(td);
  });
  var cg=t.querySelector('colgroup');
  if(cg&&cg.children[ci]){
    var w=parseFloat(cg.children[ci].style.width)||0;
    cg.removeChild(cg.children[ci]);
    if(t.style.width&&w)t.style.width=Math.max(30,(parseFloat(t.style.width)||0)-w)+'px';
  }
  Array.prototype.slice.call(t.rows).forEach(function(tr){if(!tr.cells.length)tr.parentNode.removeChild(tr)});
}
function cellDelete(rows){
  var l=csel.cells.slice(),R=csel.rect;
  if(!l.length||!R)return;
  var t=l[0].closest('table'),i;
  uOp();
  closeFmt();cellClear();plusHide();tzHide();
  if(rows){for(i=R.r2;i>=R.r1;i--)if(t.isConnected)delRow(t,i)}
  else{for(i=R.c2;i>=R.c1;i--)if(t.isConnected)delCol(t,i)}
  var left=t.isConnected?t.querySelector('td,th'):null;
  if(left)cellCaret(left);
  else{ed.focus();if(!ed.firstChild)ed.innerHTML='<div><br></div>'}
  schedule();
  if(left)tzShow(t);
}
$('cDel').onclick=function(){cellDelete(true)};
$('cDelC').onclick=function(){cellDelete(false)};

/* ---- kéo đổi cỡ bảng: thanh ngăn giữa các cột / dòng (như trên máy tính) + nút góc phải dưới phóng to thu nhỏ cả bảng ---- */
var tz={t:null,timer:null,drag:null,sig:''};
function tzHide(){tz.t=null;tz.sig='';tz.drag=null;clearInterval(tz.timer);tz.timer=null;$('tz').innerHTML=''}
function tzShow(t){
  if(!t||!ed.contains(t))return;
  tz.t=t;tzDraw();
  if(!tz.timer)tz.timer=setInterval(tzDraw,300);
}
/* mép phải của từng cột (xs) và mép dưới của từng dòng (ys), toạ độ màn hình */
function tzGeo(t){
  var g=grid(t),xs=[],ys=[],c,r,td,p,tr=t.getBoundingClientRect(),prev=tr.left;
  for(c=0;c<g.cols;c++){
    var x=null;
    for(r=0;r<g.length&&x===null;r++){
      td=g[r]&&g[r][c];
      if(!td)continue;
      p=cellPos(g,td);
      if(p.c+td.colSpan-1===c)x=td.getBoundingClientRect().right;
    }
    if(x===null)x=prev;
    xs.push(x);prev=x;
  }
  for(r=0;r<t.rows.length;r++)ys.push(t.rows[r].getBoundingClientRect().bottom);
  return {xs:xs,ys:ys,tr:tr,cols:g.cols};
}
function tzDraw(){
  if(tz.drag)return;
  var t=tz.t,box=$('tz');

  var tr=t.getBoundingClientRect(),view=$('wrap').getBoundingClientRect(),w=b.offsetWidth,h=b.offsetHeight;
  var top=tr.top-h-6;
  if(top<view.top+2){top=tr.bottom+6;if(top+h>view.bottom-2)top=view.top+2}
  var left=Math.max(4,Math.min(tr.right-w,innerWidth-w-4));
  b.style.top=Math.round(top)+'px';b.style.left=Math.round(left)+'px';
}

/* ---- chạm lề trái / lề trên của bảng: chọn cả dòng / cả cột ---- */
function selLine(t,isRow,idx){
  if(!t||!ed.contains(t))return;
  var g=grid(t),r1,r2,c1,c2,list=[],i,j,rr,cc,td,q,ch=true;
  if(isRow){r1=r2=idx;c1=0;c2=g.cols-1}else{r1=0;r2=g.length-1;c1=c2=idx}
  while(ch){                                           /* ô gộp vắt ra ngoài thì mở rộng vùng chọn cho trọn ô */
    ch=false;
    for(rr=r1;rr<=r2;rr++)for(cc=c1;cc<=c2;cc++){
      td=g[rr]&&g[rr][cc];if(!td)continue;
      q=cellPos(g,td);
      if(q.r<r1){r1=q.r;ch=true}
      if(q.r+td.rowSpan-1>r2){r2=Math.min(g.length-1,q.r+td.rowSpan-1);ch=true}
      if(q.c<c1){c1=q.c;ch=true}
      if(q.c+td.colSpan-1>c2){c2=q.c+td.colSpan-1;ch=true}
    }
  }
  for(i=r1;i<=r2;i++)for(j=c1;j<=c2;j++){td=g[i]&&g[i][j];if(td&&list.indexOf(td)<0)list.push(td)}
  if(!list.length)return;
  cellClear();plusHide();
  cellMark(list,isRow?'h':'v',{r1:r1,r2:r2,c1:c1,c2:c2});
  csel.pin=true;
  cellCaret(list[0]);
  if(fmtOn&&fmtCells!==cellKey())closeFmt();
  cellBar();
}

$('tz').addEventListener('click',function(e){
  var el=e.target,k=el&&el.className;
  if(k!=='rs'&&k!=='cs')return;
  selLine(tz.t,k==='rs',+el.getAttribute('data-i'));
});
